<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Romaji Lyrics</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">R</div>
        <div class="brand-text">
          <h1 class="brand-title">Spotify Romaji</h1>
          <span class="brand-subtitle">Kanji ke Romaji Lyrics</span>
        </div>
      </div>
      <div class="header-action">
        <label class="toggle-switch" for="toggle-enabled" title="Aktifkan / Nonaktifkan Romaji">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <!-- Source Status Card -->
    <div class="status-card" id="source-status-card">
      <div class="status-card-header">
        <span class="status-track-label">Status Validasi</span>
        <span class="status-source-badge" id="source-badge">Siap</span>
      </div>
      <div class="status-track-title" id="status-track-name">Memutar di Spotify...</div>
    </div>

    <!-- Main Settings Form -->
    <main class="settings-content">
      <!-- Section: Display Settings -->
      <section class="setting-group">
        <div class="setting-label-row">
          <label for="font-size-slider" class="setting-label">Ukuran Font Romaji</label>
          <span id="font-size-value" class="setting-value-badge">65%</span>
        </div>
        <input 
          type="range" 
          id="font-size-slider" 
          class="range-slider" 
          min="50" 
          max="90" 
          step="5" 
          value="65"
          aria-label="Ukuran font Romaji relatif terhadap Kanji"
        >
      </section>

      <!-- Section: Romaji System & Casing -->
      <div class="settings-row">
        <div class="setting-group flex-1">
          <label for="select-system" class="setting-label">Sistem</label>
          <div class="select-container">
            <select id="select-system" class="custom-select">
              <option value="hepburn">Hepburn (ō, ū)</option>
              <option value="passport">Passport (o, u)</option>
            </select>
          </div>
        </div>

        <div class="setting-group flex-1">
          <label for="select-casing" class="setting-label">Format</label>
          <div class="select-container">
            <select id="select-casing" class="custom-select">
              <option value="normal">Standar</option>
              <option value="lowercase">Kecil</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Section: Validation & Rule Toggles -->
      <section class="setting-group validation-toggles">
        <label class="checkbox-row" for="toggle-validator">
          <input type="checkbox" id="toggle-validator" checked>
          <span class="checkbox-label">
            <strong>Gunakan Lrclib Validator</strong>
            <span class="checkbox-desc">Prioritaskan lirik Romaji terverifikasi manusia.</span>
          </span>
        </label>

        <label class="checkbox-row" for="toggle-ateji">
          <input type="checkbox" id="toggle-ateji" checked>
          <span class="checkbox-label">
            <strong>Koreksi Ateji Lagu</strong>
            <span class="checkbox-desc">Koreksi kata artistik (sadame, maji, asu, dll.).</span>
          </span>
        </label>
      </section>

      <!-- Section: Custom User Dictionary -->
      <section class="setting-group custom-dict-section">
        <div class="dict-header">
          <span class="setting-label">Kamus Koreksi Kustom</span>
          <span class="dict-count" id="dict-count">0 kata</span>
        </div>

        <form id="form-add-override" class="dict-add-form">
          <input 
            type="text" 
            id="input-kanji" 
            class="dict-input" 
            placeholder="Kanji (misal: 運命)" 
            required
            aria-label="Kata Kanji asli"
          >
          <input 
            type="text" 
            id="input-romaji" 
            class="dict-input" 
            placeholder="Romaji (misal: sadame)" 
            required
            aria-label="Koreksi Romaji"
          >
          <button type="submit" class="btn-add-dict" title="Tambah koreksi">Tambah</button>
        </form>

        <div class="dict-list-container" id="dict-list">
          <div class="dict-empty-hint" id="dict-empty-hint">Belum ada kata koreksi kustom.</div>
        </div>
      </section>

      <!-- Section: Live Preview -->
      <section class="preview-section" aria-label="Pratinjau tampilan">
        <div class="preview-label">Pratinjau Tampilan (Stacked)</div>
        <div class="preview-card" id="preview-box">
          <div class="preview-romaji" id="preview-romaji">shizumu yō ni toke te yuku yō ni</div>
          <div class="preview-original">沈むように溶けてゆくように</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="status-indicator">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">Bekerja di open.spotify.com</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
