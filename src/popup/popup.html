<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utagoe — Japanese Lyrics Romaji</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 26 26" width="26" height="26" fill="none">
            <rect x="0.5" y="0.5" width="25" height="25" rx="6.5" fill="#18181B" stroke="#F59E0B" stroke-opacity="0.38"/>
            <rect x="6" y="5" width="8" height="3.5" rx="1.75" fill="#F59E0B"/>
            <circle cx="18" cy="6.75" r="2" fill="#FCD34D"/>
            <path d="M7.5 11.5V17.5C7.5 21 18.5 21 18.5 17.5V11.5" stroke="#FAFAFA" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="brand-title">Utagoe</h1>
      </div>
      <label class="toggle-switch" for="toggle-enabled" title="Enable or disable Utagoe">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="toggle-slider"></span>
      </label>
    </header>

    <!-- Editorial Underline Tabs -->
    <nav class="tab-bar" role="tablist" aria-label="Settings categories">
      <button
        type="button"
        role="tab"
        id="tab-display"
        class="tab-btn is-active"
        aria-selected="true"
        aria-controls="panel-display"
      >Style</button>
      <button
        type="button"
        role="tab"
        id="tab-reading"
        class="tab-btn"
        aria-selected="false"
        aria-controls="panel-reading"
      >Smart Fix</button>
      <button
        type="button"
        role="tab"
        id="tab-words"
        class="tab-btn"
        aria-selected="false"
        aria-controls="panel-words"
      >Dictionary</button>
    </nav>

    <!-- Category Panels -->
    <main class="settings-list">
      <!-- Style Panel -->
      <section
        id="panel-display"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-display"
      >
        <!-- Lyric Preview & Active Track -->
        <div class="preview-card" id="preview-box" title="Live preview">
          <div class="preview-romaji" id="preview-romaji">shizumu yō ni tokete yuku yō ni</div>
          <div class="preview-original">沈むように溶けてゆくように</div>
          <div class="preview-meta">
            <span class="status-track-title" id="status-track-name">Open the lyrics tab on Spotify / YT Music...</span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <span class="status-source-badge" id="source-badge">Standby</span>
          </div>
        </div>

        <!-- Controls Card -->
        <div class="card-group">
          <div class="row" title="Choose how lyrics are rendered above Japanese text">
            <label for="select-output-mode" class="row-label">Output mode</label>
            <select id="select-output-mode" class="custom-select">
              <option value="romaji">Romaji</option>
              <option value="furigana">Furigana (ruby)</option>
              <option value="hiragana">Hiragana</option>
              <option value="katakana">Katakana</option>
              <optgroup label="Translation">
                <option value="translate:en">English</option>
                <option value="translate:th">Thai</option>
                <option value="translate:zh">Chinese (Simplified)</option>
                <option value="translate:id">Indonesian</option>
                <option value="translate:ko">Korean</option>
                <option value="translate:es">Spanish</option>
                <option value="translate:vi">Vietnamese</option>
                <option value="translate:fr">French</option>
                <option value="translate:de">German</option>
                <option value="translate:pt">Portuguese</option>
              </optgroup>
            </select>
          </div>

          <div class="row" title="Romanization spelling system">
            <label for="select-system" class="row-label">Romanization</label>
            <select id="select-system" class="custom-select">
              <option value="hepburn">Hepburn (ō, ū)</option>
              <option value="passport">Passport (o, u)</option>
            </select>
          </div>

          <div class="row" title="Letter casing for Romanized output">
            <label for="select-casing" class="row-label">Case</label>
            <select id="select-casing" class="custom-select">
              <option value="normal">Standard</option>
              <option value="lowercase">Lowercase</option>
            </select>
          </div>

          <div class="row row-stack" title="Romaji font size relative to the Kanji line">
            <div class="row-top">
              <label for="font-size-slider" class="row-label">Ruby scale</label>
              <span id="font-size-value" class="setting-value-badge">65%</span>
            </div>
            <input
              type="range"
              id="font-size-slider"
              class="range-slider"
              min="50"
              max="90"
              step="5"
              value="65"
              aria-label="Romaji font size relative to the Kanji line"
            >
          </div>
        </div>
      </section>

      <!-- Smart Fix Panel -->
      <section
        id="panel-reading"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-reading"
        hidden
      >
        <div class="card-group">
          <div class="row" title="Correct any reading inline, saved to your dictionary">
            <label for="toggle-tap-to-fix" class="row-label">Tap to fix inline</label>
            <label class="toggle-switch" for="toggle-tap-to-fix">
              <input type="checkbox" id="toggle-tap-to-fix" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="row row-stack" title="Green verified, blue yours, amber dictionary, grey machine">
            <div class="row-top">
              <label for="toggle-badges" class="row-label">Confidence dots</label>
              <label class="toggle-switch" for="toggle-badges">
                <input type="checkbox" id="toggle-badges" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="row-sub">Green verified · Blue yours · Amber dict · Grey machine</div>
          </div>

          <div class="row" title="Prefer human-verified Romaji lyrics from Lrclib">
            <label for="toggle-validator" class="row-label">Lrclib validator</label>
            <label class="toggle-switch" for="toggle-validator">
              <input type="checkbox" id="toggle-validator" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="row" title="Fix artistic readings (sadame, maji, asu, etc.)">
            <label for="toggle-ateji" class="row-label">Ateji readings (sadame, maji)</label>
            <label class="toggle-switch" for="toggle-ateji">
              <input type="checkbox" id="toggle-ateji" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- Dictionary Panel -->
      <section
        id="panel-words"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-words"
        hidden
      >
        <div class="card-group" title="Custom Kanji to Romaji word overrides">
          <div class="row-top">
            <span class="row-label row-label-strong">Custom words</span>
            <span class="dict-count" id="dict-count">0 words</span>
          </div>

          <form id="form-add-override" class="dict-add-form">
            <input
              type="text"
              id="input-kanji"
              class="dict-input"
              placeholder="Kanji (運命)"
              required
              aria-label="Original Kanji word"
            >
            <input
              type="text"
              id="input-romaji"
              class="dict-input"
              placeholder="Romaji (sadame)"
              required
              aria-label="Romaji correction"
            >
            <button type="submit" class="btn-add-dict" title="Add correction">Add</button>
          </form>

          <div class="dict-list-container" id="dict-list">
            <div class="dict-empty-hint" id="dict-empty-hint">No custom corrections yet.</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Persistent Export CTA -->
    <footer class="footer-export">
      <div class="export-bar" title="Save every kanji word in the current song for Anki or spreadsheets">
        <span class="export-label">Export Song Vocab (CSV)</span>
        <button type="button" id="btn-export-vocab" class="btn-export-vocab">Export</button>
      </div>
      <div class="export-hint" id="export-hint"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
